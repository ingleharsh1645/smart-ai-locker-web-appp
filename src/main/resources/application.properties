spring.application.name=class7-smart-ai-locker
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:class7_locker}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&sslMode=${MYSQL_SSL_MODE:PREFERRED}
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.teacher.access-key=${TEACHER_ACCESS_KEY:}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}

server.port=${PORT:8080}
